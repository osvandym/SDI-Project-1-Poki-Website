<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" type="text/css" href="index.css">
  <script src="index.js" defer></script>
</head>
<body>
  <header>
    <div class="container">
      <div class="top-bar">
        <div class="pokemon-logo">
          <img class="logo" src="Images/pokemon-logo-png-1421.png" alt="Pokemon Logo" width="100" height="100">
        </div>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1>Welcome to Pokemon Search</h1>
      <p>Use this website to find your favorite Pokemon.</p>
    </div>
  </section>

  <section>
    <div Class="search-div">
        <div class="container">
          <div class="search">
            <input class="input-bar" id="inputPokemonName" type="text" placeholder="Search by name" size="50">
            <button class="search-button" id="inputButton" onclick="fetchData()">Find Your Favorite Pokemon</button>
          </div>
        </div>
    </div>
  </section>

  <section class="mid-section">
    <div class="container">
      <div class="sidebar">
        <header>
          <h4>1302 Pokemons</h4>
        </header>
        <div class="scroll-box">
          <div class="scroll-inner" id="pokemonOptions">
            <ul id="pokemonList"></ul>
          </div>
        </div>
      </div>
      <div class="pokemon-attributes">
        <h1>hello</h1>
      </div>
      <div class="pokemon">
        <img id="pokemonSprite" src="" alt="Pokemon Image" style="display: block" width="100" height="100">
      </div>
    </div>
  </section>
</body>
<footer>
  <div class="container">
    <h1>hola</h1>
  </div>
</footer>
</html>
